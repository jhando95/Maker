name: CI

# Branches are covered by `pull_request`, not by `push`.
#
# Both were on, and the two triggers do not cancel each other, so every commit
# on a branch ran this entire file **twice** on two runners — nine minutes of
# scenarios, duplicated, and two identically named checks on the pull request.
#
# The concurrency group below was supposed to prevent exactly that and could
# not, for a reason worth writing down: `github.ref` is not the same value for
# the two events. A push says `refs/heads/<branch>`; a pull_request says
# `refs/pull/<n>/merge`. Two different groups, so neither run ever cancelled the
# other, and the comment claiming they did was true only within one event type.
#
# The duplication was not merely wasteful. Every run is an independent draw
# against whatever GitHub Actions is doing that hour, and a red X appears on the
# pull request if *either* comes up short — three checks were failed in one
# afternoon by `Failed to resolve action download info`, in jobs that never got
# as far as checking out the repository. Halving the number of runs halves that
# exposure.
#
# `pull_request` is also the better of the two to keep: it builds the merge
# commit, which is what merging would actually produce, while a push build tests
# the branch in isolation from a base that may have moved underneath it.
#
# The trade, stated plainly: a branch with no pull request open now gets no run
# at all. `synchronize` fires on every push to a branch that has one, and
# `opened` fires the moment one is raised, so the gap is only ever the stretch
# before a branch is proposed — and nothing merges out of that stretch. This
# also does nothing to stop the outages themselves; there is no step-level
# retry that could, because the failure happens in "Prepare all required
# actions", before any step in this file runs.
#
# `workflow_dispatch` is here for a third reason, discovered the hard way. Six
# consecutive pushes to an open pull request produced **no runs at all** — not
# queued, not cancelled, not created — over four hours. Nothing in this file
# causes that and nothing in it fixes it, but without a manual trigger there is
# no way to ask again, and a branch with no run on it is indistinguishable from
# a branch whose run failed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
#
# Keyed on `head_ref` where there is one — that is the branch name on a
# pull_request event — and on `ref` otherwise, so a push to main groups by
# itself. Keyed on `ref` alone this never deduplicated across event types.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# A note about jobs cancelled at fifteen minutes, and what these numbers are not.
#
# During a GitHub capacity shortage this repository saw run after run cancelled
# at exactly 15m 1s having never been assigned a machine — `runner_id: 0`, no
# runner name, no steps at all. The obvious suspect was `timeout-minutes`, on
# the theory that its clock covers queue time as well as run time.
#
# **That theory is wrong, and it was tested.** The value was raised from 15 to
# 30 and the very next run was cancelled at 15m 1s again, still unassigned. So
# the fifteen minutes is a limit on how long a job may wait for a runner, it
# belongs to the platform, and nothing in this file changes it. Recorded here
# because it cost an afternoon to find out and the wrong answer is convincing.
#
# The numbers below are therefore sized for the work alone, with headroom for a
# slow machine rather than for a queue: the checks take about nine minutes when
# they are healthy and the benchmark well under one. They are still a bound, so
# a genuinely hung job dies rather than running to the six-hour default.
jobs:
  check:
    runs-on: ubuntu-latest
    # ~9 minutes of work, with room for a slow runner.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx vite build

      # The harness boots the real game in headless Chromium and fails on any
      # console error or uncaught exception. It catches the whole class of bug
      # unit tests cannot see — a shader that will not compile, a module that
      # throws at import, an initialization order that only breaks in a browser.
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Headless smoke test
        run: node tools/shoot.mjs --out /tmp/ci-smoke.png --settle 3000

      # The crash handler's claim is that a throw inside the render loop is
      # survivable and visible. Nothing short of a real browser can check that,
      # so the scenario throws for real and asserts on what a player would see.
      - name: Crash-handler scenario
        run: node tools/shoot.mjs --scenario scenarios/crash.mjs --allow-errors --out /tmp/ci-crash.png

      # Same reasoning: how a stick maps to intent is unit-tested, but whether
      # that intent survives the poll, the buffer, the tick and the character
      # controller is a chain that only exists in a browser.
      - name: Controller scenario
        run: node tools/shoot.mjs --scenario scenarios/gamepad.mjs --out /tmp/ci-gamepad.png

      - name: Part-wheel scenario
        run: node tools/shoot.mjs --scenario scenarios/wheel.mjs --out /tmp/ci-wheel.png

      # The water fight is a loop across the mode, the shell and the HUD: run
      # dry, find a tap, fill up, hose someone. Each piece is unit-tested and
      # each seam between them has broken at least once with the suite green.
      - name: Water-fight scenario
        run: node tools/shoot.mjs --scenario scenarios/water.mjs --auto-quality --out /tmp/ci-water.png

      # Multiple people in one world, with no network yet to bring them. The
      # roster and teams are unit-tested; that a second body reaches the
      # renderer's instance buffers, wears the right shirt and moves on its own
      # commands only happens in a browser.
      - name: Multiple-actor scenario
        run: node tools/shoot.mjs --scenario scenarios/actors.mjs --auto-quality --out /tmp/ci-actors.png

      # The HUD's job is to say what a mode knows, and every part of that is a
      # seam between two systems rather than logic inside either — so the unit
      # suite stays green with the objective compass, the hit marker and the
      # damage cue all broken.
      - name: HUD scenario
        run: node tools/shoot.mjs --scenario scenarios/hud.mjs --auto-quality --out /tmp/ci-hud.png

      # Two people in one world over the real wire format. The session is
      # unit-tested end to end against a loopback pair, but whether somebody who
      # joined ever reaches the renderer is a different question — and the answer
      # was no, once, because the roster was only rebuilt by a running mode.
      - name: Multiplayer scenario
        run: node tools/shoot.mjs --scenario scenarios/multiplayer.mjs --auto-quality --out /tmp/ci-multiplayer.png

      # Mantling against a wall a player actually built, on the real map,
      # through the real movement code. The unit tests build a ledge out of two
      # boxes in an empty world; this asks whether a fort yields to a pull-up,
      # which is the question the mechanic exists to answer.
      - name: Mantle scenario
        run: node tools/shoot.mjs --scenario scenarios/mantle.mjs --auto-quality --out /tmp/ci-mantle.png

      # The garden's items, which are two claims about the map rather than
      # about the effect: that the prop is where the effect thinks it is, and
      # that a launch reaches the thing it was sized against. The unit suite
      # can check neither, and both have been wrong once — a mat left under
      # the treehouse deck, and a speed picked against a gravity the game does
      # not use.
      - name: Items scenario
        run: node tools/shoot.mjs --scenario scenarios/items.mjs --auto-quality --out /tmp/ci-items.png

      # Tag, which is two claims a unit test cannot reach. The field is the one
      # place no other mode goes — outside the fence, on the cul-de-sac — and
      # "outside the fence" is not a setting but a routing grid and a set of
      # bots willing to follow it out of the gate. And it is the first mode with
      # no plank and no soaker, so it is the first to find out what a HUD
      # written for modes that have both does with a mode that has neither.
      - name: Tag scenario
        run: node tools/shoot.mjs --scenario scenarios/tag.mjs --auto-quality --out /tmp/ci-tag.png

      # The edge of the world, and the only way to find out where it is: walk
      # at it. All three holes this closes were found by driving the real player
      # around and none of them was visible to a unit test — an infinite ground
      # plane, a fence that is a picture, and a body under the world wedged in
      # place. A boundary is a claim about what happens after twenty seconds of
      # sprinting, which is a thing only a browser can spend.
      - name: Bounds scenario
        run: node tools/shoot.mjs --scenario scenarios/bounds.mjs --auto-quality --out /tmp/ci-bounds.png

      # The screens a player meets before they play, and the readout for when
      # they do. Menus are the one part of this game with no simulation behind
      # them, so every way they go wrong is a layout — the title screen ran off
      # the bottom of a 720-line window with no way to scroll, which put
      # Settings out of reach entirely and is invisible to every kind of test
      # except one that measures the card against the window.
      - name: Front-end scenario
        run: node tools/shoot.mjs --scenario scenarios/frontend.mjs --auto-quality --out /tmp/ci-frontend.png

      # The whole of the lobby, end to end against a real server: two browser
      # contexts, two friend codes, a party, a queue, and a round running in the
      # room it was matched into. It is also the only thing that exercises the
      # real relay — every other multiplayer check uses an in-page transport,
      # which is why a guest's hello being dropped before the socket opened went
      # unnoticed for as long as it did.
      - name: Lobby scenario
        run: node tools/shoot.mjs --scenario scenarios/lobby.mjs --auto-quality --out /tmp/ci-lobby.png

      # The other half of a session, and a different claim: that a round nobody
      # on this machine is running arrives as pixels. The page joins and the
      # scenario plays host, which is the mirror of the one above.
      - name: Guest-in-a-round scenario
        run: node tools/shoot.mjs --scenario scenarios/party.mjs --auto-quality --out /tmp/ci-party.png

      # The character rig is almost entirely a claim about pixels, and two of the
      # three things it is for went wrong in ways no unit test would have caught:
      # eyes placed inside the skull, and hair that grew down over the face. The
      # ink check works by diffing two screenshots, because a one-pixel line is
      # invisible to the eye and unmistakable in a pixel count.
      - name: Character scenario
        run: node tools/shoot.mjs --scenario scenarios/kids.mjs --auto-quality --out /tmp/ci-kids.png

      # The budget is the first rule that can make a legal placement fail. The
      # arithmetic is unit-tested; whether the player is ever told — a counter
      # on the banner, a price on the chip, a ghost that turns red — is a chain
      # from the mode to a pixel that only exists in a browser.
      - name: Lumber-budget scenario
        run: node tools/shoot.mjs --scenario scenarios/lumber.mjs --auto-quality --out /tmp/ci-lumber.png

      # The ground is the largest surface in every frame the game draws, and
      # both halves of it are claims about pixels that the unit suite cannot
      # follow: a vertex colour attribute that has to survive the toon shader,
      # and ten thousand instanced clumps that have to survive InstancedMesh
      # tinting. The second one already rendered every blade black once.
      - name: Lawn scenario
        run: node tools/shoot.mjs --scenario scenarios/lawn.mjs --auto-quality --out /tmp/ci-lawn.png

      # A CI runner has no GPU either, so it is a genuine instance of the case
      # adaptive quality exists for. The decision logic is unit-tested; this
      # checks the decision reaches the drawing buffer.
      - name: Adaptive quality scenario
        run: node tools/shoot.mjs --scenario scenarios/quality.mjs --auto-quality --out /tmp/ci-quality.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            /tmp/ci-smoke.png
            /tmp/ci-crash.png
            /tmp/ci-gamepad.png
            /tmp/ci-quality.png
            /tmp/ci-wheel.png
            /tmp/ci-water.png
            /tmp/ci-actors.png
            /tmp/ci-hud.png
            /tmp/ci-lumber.png
            /tmp/ci-kids.png
            /tmp/ci-lawn.png
            /tmp/ci-party.png
            /tmp/ci-multiplayer.png
            /tmp/ci-lobby.png
            /tmp/ci-mantle.png
            /tmp/ci-items.png
            /tmp/ci-tag.png
            /tmp/ci-bounds.png
            /tmp/ci-frontend.png
            /tmp/ci-lobby-friends.png
          if-no-files-found: ignore

  benchmark:
    runs-on: ubuntu-latest
    # Well under a minute of work; the budget is almost entirely queue.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Reported, not gated. A shared CI runner's timings are too noisy to fail
      # a build on, but a regression is obvious in the log next to the previous
      # run — and the tests already guard the specific costs that matter.
      - name: Simulation benchmark
        run: npm run bench
